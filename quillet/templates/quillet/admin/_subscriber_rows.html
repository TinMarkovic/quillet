{% for sub in subscribers %}
<tr>
  <td>{{ sub.email }}</td>
  <td>
    {% if sub.unsubscribed %}
      <span class="badge badge-draft">Unsubscribed</span>
    {% elif sub.confirmed_at %}
      <span class="badge badge-published">Confirmed</span>
    {% else %}
      <span class="badge badge-draft">Pending</span>
    {% endif %}
  </td>
  <td class="muted">
    {{ sub.confirmed_at.strftime('%b %d, %Y') if sub.confirmed_at else '—' }}
  </td>
  <td>
    <form method="post" action="{{ url_for('quillet.delete_subscriber', newsletter_slug=newsletter.slug, subscriber_id=sub.id) }}"
          onsubmit="return confirm('Remove {{ sub.email }}?')">
      <button class="btn btn-danger" type="submit" style="padding:0.2rem 0.5rem;font-size:0.8em;">Remove</button>
    </form>
  </td>
</tr>
{% endfor %}
{% if next_cursor %}
<tr hidden data-next-cursor="{{ next_cursor }}"></tr>
{% endif %}
